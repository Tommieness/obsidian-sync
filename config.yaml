obsidian:
  vault_path: "/Users/tommiesexton/Library/CloudStorage/OneDrive-Personal/Agent Build"
  # Only these notes and folders are shared with Open WebUI. Everything else stays out.
  include_paths:
    - "LAB.md"
    - "wiki"
    - "schema"
  exclude_dirs:
    - ".obsidian"
    - ".trash"
  exclude_patterns:
    - "*.excalidraw.md"
openwebui:
  url: "http://localhost:3000"
  collection_name: "Obsidian Vault"
sync:
  state_file: ".sync_state.json"
  delete_removed_files: true
